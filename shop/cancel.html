<!DOCTYPE html>
<html lang="ar" data-theme="dark" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Annulé | Hikma & Nour</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      background: var(--bg-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    .cancel-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .cancel-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }
    h1 {
      color: var(--text-primary);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }
    p {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent-gold);
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: opacity 0.3s;
    }
    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="cancel-container">
    <div class="cancel-icon">❌</div>
    <h1 id="title">تم إلغاء الدفع</h1>
    <p id="message">لقد تم إلغاء عملية الدفع. لم يتم خصم أي مبلغ من حسابك.</p>
    <a href="../shop/index.html" class="btn" id="btn-back">العودة إلى المتجر</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lang = urlParams.get('lang') || 'ar';

    const T = {
      ar: {
        title: "تم إلغاء الدفع",
        msg: "لقد تم إلغاء عملية الدفع. لم يتم خصم أي مبلغ من حسابك.",
        btn: "العودة إلى المتجر"
      },
      fr: {
        title: "Paiement annulé",
        msg: "Le processus de paiement a été annulé. Aucun montant n'a été débité.",
        btn: "Retour à la boutique"
      },
      en: {
        title: "Payment cancelled",
        msg: "The payment process was cancelled. You have not been charged.",
        btn: "Back to shop"
      }
    };

    if (lang === 'fr' || lang === 'en') {
      document.documentElement.lang = lang;
      document.documentElement.dir = 'ltr';
    }

    const t = T[lang] || T.ar;
    document.getElementById('title').textContent = t.title;
    document.getElementById('message').textContent = t.msg;
    document.getElementById('btn-back').textContent = t.btn;
  </script>
</body>
</html>
